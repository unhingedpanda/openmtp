name: Native macOS verification

on:
  push:
    branches: [codex/native-macos-ui]
    paths:
      - native/macos/**
      - .github/workflows/native-macos.yml
  workflow_dispatch:
    inputs:
      runner:
        description: Standard hosted macOS environment
        type: choice
        default: macos-26
        options: [macos-26, xcode-27]

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}-${{ inputs.runner || 'macos-26' }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard hosted runners are free for public repositories.
    if: github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.runner == 'macos-26' || inputs.runner == 'xcode-27')
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    env:
      EVIDENCE: native/macos/build/remote-evidence
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare tools and fixtures
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          {
            sw_vers
            uname -m
            xcodebuild -version
            git rev-parse HEAD
          } > "$EVIDENCE/environment.txt"
          test "$(uname -m)" = arm64
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          python3 native/macos/Scripts/make-fixtures.py /tmp/openmtp-native-fixtures
          xcodegen generate --spec native/macos/project.yml

      - name: Build release preview
        id: build
        run: |
          set -euo pipefail
          native/macos/Scripts/build.sh 2>&1 | tee "$EVIDENCE/release-build.log"
          python3 native/macos/Scripts/verify-bundle.py \
            'native/macos/build/release/Build/Products/Release/OpenMTP Native.app' \
            --output "$EVIDENCE/bundle-verification.json"

      - name: Run unit behavior tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcodebuild test \
            -project native/macos/OpenMTPNative.xcodeproj \
            -scheme OpenMTPNative \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath native/macos/build/remote \
            -resultBundlePath "$EVIDENCE/behavior.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:OpenMTPNativeTests \
            -skip-testing:OpenMTPNativeTests/BrowserPerformanceTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$EVIDENCE/behavior-tests.log"

      - name: Preserve unit feedback immediately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-feedback-${{ inputs.runner || 'macos-26' }}-${{ github.run_id }}
          path: native/macos/build/remote-evidence/behavior-tests.log
          retention-days: 3

      - name: Run desktop UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild test \
            -project native/macos/OpenMTPNative.xcodeproj \
            -scheme OpenMTPNative \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath native/macos/build/remote \
            -resultBundlePath "$EVIDENCE/ui.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:OpenMTPNativeUITests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$EVIDENCE/ui-tests.log"

      - name: Diagnose hosted launch with a minimal control
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/Launch Reference.app"
          mkdir -p "$reference/Contents/MacOS"
          swiftc -O -target arm64-apple-macos26.0 -parse-as-library native/macos/Scripts/LaunchReference.swift -o "$reference/Contents/MacOS/LaunchReference"
          swiftc -O native/macos/Scripts/WindowProbe.swift -o "$RUNNER_TEMP/window-probe"
          python3 - "$reference" <<'PY'
          import os, pathlib, plistlib, signal, subprocess, sys
          app = pathlib.Path(sys.argv[1])
          (app / 'Contents/Info.plist').write_bytes(plistlib.dumps({'CFBundleExecutable': 'LaunchReference', 'CFBundleIdentifier': 'dev.yash.openmtp.launchreference', 'CFBundleName': 'Launch Reference', 'CFBundlePackageType': 'APPL', 'NSPrincipalClass': 'NSApplication'}))
          subprocess.run(['codesign', '--force', '--sign', '-', str(app)], check=True)
          report = pathlib.Path(os.environ['EVIDENCE']) / 'reference-launch.json'
          subprocess.run([os.environ['RUNNER_TEMP'] + '/window-probe', '--launch', str(app), str(report)], check=True, timeout=25)
          import json
          result = json.loads(report.read_text())
          print(result)
          os.kill(result['pid'], signal.SIGTERM)
          PY

      - name: Run browser performance test separately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcodebuild test \
            -project native/macos/OpenMTPNative.xcodeproj \
            -scheme OpenMTPNative \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath native/macos/build/remote \
            -resultBundlePath "$EVIDENCE/browser.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:OpenMTPNativeTests/BrowserPerformanceTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$EVIDENCE/browser-tests.log"

      - name: Measure release preview on the remote Mac
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 native/macos/Scripts/benchmark.py \
            'native/macos/build/release/Build/Products/Release/OpenMTP Native.app' \
            /tmp/openmtp-native-fixtures/1000 \
            --output "$EVIDENCE/process-benchmark.json" \
            2>&1 | tee "$EVIDENCE/process-benchmark.log"

      - name: Collect browser measurement
        if: always()
        run: |
          if test -f native/macos/build/browser-performance.json; then
            cp native/macos/build/browser-performance.json "$EVIDENCE/"
          fi
          python3 - <<'PY'
          import os, pathlib, shutil, tempfile
          log = pathlib.Path(tempfile.gettempdir()) / 'openmtp-native-launch.log'
          if log.exists(): shutil.copyfile(log, pathlib.Path(os.environ['EVIDENCE']) / 'app-launch.log')
          PY
          for suite in behavior ui browser; do
            result="$EVIDENCE/$suite.xcresult"
            if test -d "$result"; then
              xcrun xcresulttool get test-results summary --path "$result" > "$EVIDENCE/$suite-summary.json" || true
              xcrun xcresulttool export attachments --path "$result" --output-path "$EVIDENCE/$suite-attachments" || true
            fi
          done

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-macos-${{ inputs.runner || 'macos-26' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native/macos/build/remote-evidence/*.log
            native/macos/build/remote-evidence/*.json
            native/macos/build/remote-evidence/*.txt
            native/macos/build/remote-evidence/*-attachments/**/*.png
            native/macos/build/remote-evidence/*-attachments/**/*.jpg
            native/macos/build/remote-evidence/*-attachments/**/*.heic
            native/macos/build/remote-evidence/*-attachments/**/*.json
          if-no-files-found: warn
          retention-days: 3
